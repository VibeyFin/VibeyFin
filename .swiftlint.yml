included:
  - iosApp/iosApp
  - iosApp/Tests

excluded:
  - iosApp/Vendor

disabled_rules:
  # As in the Kotlin code, where ktlint and detekt leave the line length alone
  - line_length
  # SwiftUI's own `Button(action: { ... }) { label }` shape
  - multiple_closures_with_trailing_closure
  # Either is fine; trailing commas keep diffs to the line that changed
  - trailing_comma

identifier_name:
  min_length: 2
  # Coordinates and the names Swift reads best with
  excluded: [id, x, y, on, by, at]

type_name:
  excluded: [iOSApp]

function_parameter_count:
  warning: 8
  error: 12

# The player is one object and one view; splitting them is a change of its own
file_length:
  warning: 700
type_body_length:
  warning: 600

custom_rules:
  no_raw_white:
    name: "No raw white"
    regex: '(?<![A-Za-z.])(Color)?\.white\b(?!space)(?!\w)'
    match_kinds: [identifier]
    excluded: 'iosApp/iosApp/(App/Theme|App/GeneratedTheme|Components/Logo|Settings/SettingsRows)\.swift'
    message: "Use Brand.onMedia, Brand.action or Brand.overlay* instead of raw white."
    severity: error
  no_raw_black:
    name: "No raw black"
    regex: '(?<![A-Za-z])(Color|UIColor)?\.black\b'
    excluded: 'iosApp/iosApp/(App/Theme|App/GeneratedTheme|Components/Logo|Settings/SettingsRows)\.swift'
    message: "Use Brand.scrim, Brand.scrimStrong or Brand.onAction instead of raw black."
    severity: error
  no_color_literals:
    name: "No colour literals"
    regex: '\b(Color|UIColor)\((hex|red|white):'
    excluded: 'iosApp/iosApp/(App/Theme|App/GeneratedTheme|Components/Logo)\.swift'
    message: "Colours come from Brand in App/Theme.swift."
    severity: error
