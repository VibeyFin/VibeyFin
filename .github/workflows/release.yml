name: Release

# Push a tag like v0.2.0 to publish a signed APK. Tags with a suffix (v0.2.0-beta.1) become pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :shared:testAndroidHostTest :androidApp:assembleRelease \
            -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "VibeyFin-${GITHUB_REF_NAME}.apk"
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "VibeyFin-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes $FLAGS
