[versions]
# Resolved against Maven Central / Google Maven / services.gradle.org on 2026-10-19 (latest stable).
agp = "9.5.0"
kotlin = "2.4.21"
lifecycle = "2.11.0"
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.12.0"
activity-compose = "1.13.0"
# Storage, resolved 2026-10-19 (latest stable of each; DataStore 1.3.0 is still rc).
# Room 3 (androidx.room3) is the current stable generation; Room 2.8.x is the previous one.
room = "3.0.3"
ksp = "2.3.12"
sqlite = "2.7.1"
datastore = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
# Networking, resolved 2026-10-19 (latest stable).
ktor = "3.6.0"
# Native Android UI (Jetpack Compose), resolved 2026-10-19 (latest stable).
androidx-compose-bom = "2026.09.00"
androidx-navigation = "2.10.2"
coil = "3.6.3"
# Media3 (ExoPlayer) for the Android player, resolved 2026-10-20 on Google Maven (latest stable).
androidx-media3 = "1.11.1"
# Jellyfin's build of the Media3 ffmpeg audio decoder (DTS, TrueHD, AC-3), resolved 2026-10-20 on Maven Central.
# Google doesn't publish one. It is built against Media3 1.9.0, older than the 1.11.1 above.
jellyfin-media3-ffmpeg = "1.9.0+1"
# WorkManager for background polling of new titles and for the downloads, resolved 2026-10-26 on Google Maven (latest stable).
androidx-work = "2.12.0"
# Macrobenchmark and the baseline profile, resolved 2026-10-26 on Google Maven (latest stable; the metadata's newest benchmark is an alpha).
androidx-benchmark = "1.5.0"
androidx-baselineprofile = "1.5.0"
androidx-profileinstaller = "1.4.1"
androidx-uiautomator = "2.4.0"

# Android SDK levels (not dependencies). compileSdk 37 is required by the latest stable
# lifecycle 2.11.0 / Compose 1.12.x AARs; targetSdk is a separate runtime-behaviour choice.
android-compileSdk = "37"
android-targetSdk = "36"
android-minSdk = "26"
ktlint = "1.8.0"
jlleitschuh-ktlint = "14.2.0"
detekt = "2.0.0-alpha.6"

[libraries]

lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
# Only used to unpack desktop natives for JVM host tests; never shipped in the app.
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }
datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "androidx-media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "androidx-media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "androidx-media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "androidx-media3" }
jellyfin-media3-ffmpeg-decoder = { module = "org.jellyfin.media3:media3-ffmpeg-decoder", version.ref = "jellyfin-media3-ffmpeg" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidx-benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidx-profileinstaller" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidx-uiautomator" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidx-baselineprofile" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room3", version.ref = "room" }
versions = { id = "com.github.ben-manes.versions", version = "0.66.0" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version = "1.1.2" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "jlleitschuh-ktlint" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
