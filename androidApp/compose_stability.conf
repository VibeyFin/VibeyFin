// The shared module's models and UI state are plain immutable data (vals and lists that are never changed in place), but it is a
// separate module with no Compose in it, so the compiler cannot see that. Naming them here lets a screen skip redrawing a row or
// a card whose data is equal to what it already shows, instead of redrawing every visible one each time any row finishes loading.
app.vibeyfin.domain.model.*
app.vibeyfin.domain.FilterOption
app.vibeyfin.ui.**
kotlin.collections.*
kotlin.Pair
